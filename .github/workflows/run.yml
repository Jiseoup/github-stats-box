name: Update GitHub Stats Gist
on:
    workflow_dispatch:
    schedule: # 00:00 KST == 15:00 UTC
        - cron: '0 15 * * *'
    push:
        branches: master
jobs:
    run:
        runs-on: ubuntu-latest
        permissions:
            contents: write # Needed for the keepalive step to push an empty commit
        steps:
            # Run the gist update FIRST, before checkout, so it runs in an empty workspace.
            # (This repo *is* the github-stats-box package; checking it out would shadow the
            #  published `npx github-stats-box@1` with an uninstalled local copy.)
            - uses: actions/setup-node@v5
              with:
                  node-version: 20
            - run: npx github-stats-box@1
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }} # Do not edit, defined in secrets
                  GIST_ID: ${{ secrets.GIST_ID }} # The ID portion from your gist url
                  ALL_COMMITS: true # If `true` it will count all commits, if `false` it will count your last year commits
                  K_FORMAT: true # If `true`, large numbers will be formatted with a "k", for example "1.5k"
            # Keeps the scheduled workflow from being auto-disabled after 60 days of inactivity.
            # Pushes an empty keepalive commit only when the repo has had no commits for 50+ days.
            - uses: actions/checkout@v5
            - name: Keepalive
              run: |
                  last=$(git log -1 --format=%ct)
                  days=$(( ( $(date +%s) - last ) / 86400 ))
                  echo "Days since last commit: $days"
                  if [ "$days" -ge 50 ]; then
                      git config user.name "github-actions[bot]"
                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                      git commit --allow-empty -m "chore: keepalive to prevent workflow auto-disable"
                      git push
                  fi
